name: Build

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  pull_request:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'

jobs:
  build:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    env:
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fix node-gyp (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install --global node-gyp@latest
          npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}
        shell: pwsh

      - name: Lint
        run: yarn run lint

      - name: Run tests
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@v1
        with:
          run: yarn run test

      - name: Run tests
        if: runner.os != 'Linux'
        run: yarn run test

      - name: Build
        run: yarn build:bin
