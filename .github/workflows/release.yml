name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    env:
      MARKTEXT_IS_STABLE: 1
      MARKTEXT_EXIT_ON_ERROR: 1
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get -y update
          sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev libfontconfig-dev rpm

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Fix node-gyp (Windows)
        if: runner.os == 'Windows'
        run: |
          npm install --global node-gyp@latest
          npm prefix -g | % {npm config set node_gyp "$_\node_modules\node-gyp\bin\node-gyp.js"}
        shell: pwsh

      - name: Lint
        run: yarn run lint

      - name: Run tests
        if: runner.os == 'Linux'
        uses: GabrielBB/xvfb-action@v1
        with:
          run: yarn run test

      - name: Run tests
        if: runner.os != 'Linux'
        run: yarn run test

      - name: Build & release (Linux)
        if: runner.os == 'Linux'
        run: yarn run release:linux --publish always

      - name: Build & release (macOS)
        if: runner.os == 'macOS'
        run: yarn run release:mac --publish always

      - name: Build & release (Windows)
        if: runner.os == 'Windows'
        run: yarn run release:win --publish always

      - name: Calculate checksums
        if: runner.os == 'Linux'
        run: |
          echo "=== Checksums ==="
          sha256sum build/macaron-*.tar.gz 2>/dev/null || true
          sha256sum build/macaron-*.AppImage 2>/dev/null || true
          sha256sum build/macaron-*.deb 2>/dev/null || true
          sha256sum build/macaron-*.rpm 2>/dev/null || true

      - name: Calculate checksums (macOS)
        if: runner.os == 'macOS'
        run: |
          echo "=== Checksums ==="
          shasum -a 256 build/macaron-*-mac.zip 2>/dev/null || true
          shasum -a 256 build/macaron-*.dmg 2>/dev/null || true

      - name: Calculate checksums (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Write-Host "=== Checksums ==="
          Get-FileHash -Algorithm SHA256 "build\macaron-setup.exe" -ErrorAction SilentlyContinue
          Get-FileHash -Algorithm SHA256 "build\macaron-*-win.zip" -ErrorAction SilentlyContinue
