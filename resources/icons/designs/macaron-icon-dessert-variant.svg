<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="52" y1="52" x2="460" y2="460" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF7FB"/>
      <stop offset="1" stop-color="#FFF1E6"/>
    </linearGradient>

    <linearGradient id="shellTop" x1="132" y1="138" x2="380" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD9E8"/>
      <stop offset="0.55" stop-color="#E7E0FF"/>
      <stop offset="1" stop-color="#DDF3FF"/>
    </linearGradient>

    <linearGradient id="shellBottom" x1="132" y1="268" x2="380" y2="370" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7C9"/>
      <stop offset="0.6" stop-color="#FFE0EE"/>
      <stop offset="1" stop-color="#E8F6FF"/>
    </linearGradient>

    <linearGradient id="cream" x1="148" y1="246" x2="364" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF1B8"/>
      <stop offset="0.5" stop-color="#FFDCE8"/>
      <stop offset="1" stop-color="#E6E1FF"/>
    </linearGradient>

    <filter id="shadow" x="40" y="40" width="432" height="432" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#7A5A68" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="120" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="88" y="96" width="336" height="320" rx="92" fill="#FFFFFF" fill-opacity="0.65"/>

    <!-- top macaron shell -->
    <ellipse cx="256" cy="206" rx="124" ry="72" fill="url(#shellTop)"/>
    <ellipse cx="256" cy="214" rx="116" ry="62" fill="#FFFFFF" fill-opacity="0.2"/>

    <!-- cream filling -->
    <rect x="148" y="246" width="216" height="28" rx="14" fill="url(#cream)"/>

    <!-- bottom macaron shell -->
    <ellipse cx="256" cy="306" rx="124" ry="72" fill="url(#shellBottom)"/>
    <ellipse cx="256" cy="296" rx="112" ry="56" fill="#FFFFFF" fill-opacity="0.18"/>

    <!-- shell feet texture -->
    <g opacity="0.55" fill="#F8C9DA">
      <rect x="166" y="255" width="14" height="8" rx="4"/>
      <rect x="186" y="255" width="14" height="8" rx="4"/>
      <rect x="206" y="255" width="14" height="8" rx="4"/>
      <rect x="226" y="255" width="14" height="8" rx="4"/>
      <rect x="246" y="255" width="14" height="8" rx="4"/>
      <rect x="266" y="255" width="14" height="8" rx="4"/>
      <rect x="286" y="255" width="14" height="8" rx="4"/>
      <rect x="306" y="255" width="14" height="8" rx="4"/>
      <rect x="326" y="255" width="14" height="8" rx="4"/>
    </g>

    <!-- brand letter -->
    <text x="256" y="286"
          text-anchor="middle"
          font-family="Times New Roman, Georgia, serif"
          font-size="112"
          font-weight="700"
          fill="#5B3F49">
      M
    </text>
  </g>
</svg>
